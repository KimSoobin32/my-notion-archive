<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MY RESTAURANT ARCHIVE</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header class="header">
    <h1>🍞 맛집 아카이브</h1>
    <p class="subtitle">카드를 클릭하면 상세 리뷰를 확인할 수 있습니다.</p>
  </header>

  <main class="container">
    <!-- index.html 내 정렬 영역 -->
    <div class="controls-bar" style="display: flex; justify-content: flex-end; margin-bottom: 20px;">
      <select id="sort-select" style="background: #2e3440; color: #eceff4; border: 1px solid #4c566a; padding: 8px 12px; border-radius: 6px; font-size: 0.95rem; cursor: pointer;">
        <option value="latest" selected>최신 방문순</option>
        <option value="oldest">오래된 방문순</option>
        <option value="rating-desc">별점 높은순</option>
        <option value="rating-asc">별점 낮은순</option>
      </select>
    </div>
    
    <div class="grid" id="restaurant-grid">
      <div class="loading">데이터를 불러오는 중입니다...</div>
    </div>
  </main>

  <!-- 상세 리뷰 모달 (팝업) -->
  <div class="modal-overlay" id="modal-overlay" aria-hidden="true">
    <div class="modal">
      <button class="modal-close" id="modal-close">&times;</button>
      <div class="modal-body" id="modal-body">
        <!-- app.js에서 클릭한 카드의 상세 정보가 동적으로 삽입됩니다 -->
      </div>
    </div>
  </div>

  <script src="./js/app.js"></script>
</body>
</html>
