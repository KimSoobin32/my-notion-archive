<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MY RESTAURANT ARCHIVE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      background: #0f1117; 
      color: #f3f4f6; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      padding: 40px 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    
    header { margin-bottom: 32px; border-bottom: 1px solid #2e3440; padding-bottom: 20px; }
    h1 { font-size: 2rem; font-weight: 800; color: #ffffff; }
    p.subtitle { color: #9ca3af; margin-top: 8px; font-size: 0.95rem; }

    .grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
      gap: 24px; 
    }
    
    .card { 
      background: #1a1d26; 
      border-radius: 16px; 
      padding: 24px; 
      border: 1px solid #2e3440; 
      transition: transform 0.2s ease, border-color 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: #4c566a;
    }

    .card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .icon { font-size: 2rem; line-height: 1; }
    .title { font-size: 1.3rem; font-weight: 700; color: #fff; }

    .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .tag { 
      background: #2e3440; 
      color: #d8dee9; 
      font-size: 0.8rem; 
      padding: 4px 10px; 
      border-radius: 20px; 
    }
    .tag.city { background: #3b4252; color: #88c0d0; }

    .rating { color: #ebcb8b; font-size: 1rem; margin-bottom: 12px; font-weight: bold; }
    
    .comment { 
      background: #242933; 
      padding: 12px; 
      border-radius: 8px; 
      font-size: 0.9rem; 
      color: #e5e9f0; 
      line-height: 1.5;
      margin-bottom: 16px;
      flex-grow: 1;
    }

    .date { font-size: 0.8rem; color: #6c7a96; text-align: right; }
    .loading { text-align: center; grid-column: 1 / -1; padding: 40px; color: #9ca3af; }
  </style>
</head>
<body>
  <header>
    <h1>🍞 맛집 아카이브</h1>
    <p class="subtitle">노션 데이터베이스와 실시간으로 연동되는 나만의 맛집 기록장</p>
  </header>

  <div class="grid" id="grid">
    <div class="loading">데이터를 불러오는 중입니다...</div>
  </div>

  <script>
    // 노션 데이터 속성별 안전한 텍스트 추출 함수들
    function getTitle(props) {
      for (const key in props) {
        if (props[key].type === 'title' && props[key].title?.length > 0) {
          return props[key].title[0].plain_text;
        }
      }
      return '이름 없음';
    }

    function getTextProperty(prop) {
      if (!prop) return '';
      if (prop.type === 'rich_text' && prop.rich_text?.length > 0) {
        return prop.rich_text[0].plain_text;
      }
      if (prop.type === 'select' && prop.select) {
        return prop.select.name;
      }
      if (prop.type === 'multi_select' && prop.multi_select) {
        return prop.multi_select.map(s => s.name).join(', ');
      }
      return '';
    }

    function getRatingProperty(prop) {
      if (!prop) return '';
      if (prop.type === 'number') return '★'.repeat(prop.number) || '평점 없음';
      if (prop.type === 'select' && prop.select) return prop.select.name;
      return getTextProperty(prop);
    }

    function getDateProperty(prop) {
      if (!prop || !prop.date) return '';
      return prop.date.start || '';
    }

    async function loadData() {
      const grid = document.getElementById('grid');
      try {
        const res = await fetch('/api/notion');
        const data = await res.json();
        
        grid.innerHTML = '';

        if (!Array.isArray(data) || data.length === 0) {
          grid.innerHTML = '<div class="loading">등록된 맛집 데이터가 없습니다.</div>';
          return;
        }

        data.forEach(item => {
          const props = item.properties || {};

          // 1. 대표 정보 추출
          const icon = item.icon?.type === 'emoji' ? item.icon.emoji : '🍽️';
          const title = getTitle(props);
          const menu = getTextProperty(props['매뉴']) || getTextProperty(props['메뉴']);
          const city = getTextProperty(props['City']) || getTextProperty(props['도시']);
          const rating = getRatingProperty(props['Rating']) || getRatingProperty(props['평점']);
          const comment = getTextProperty(props['Comment']) || getTextProperty(props['코멘트']);
          const visitDate = getDateProperty(props['방문일']);

          // 2. 카드 HTML 생성
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div>
              <div class="card-header">
                <span class="icon">${icon}</span>
                <span class="title">${title}</span>
              </div>

              <div class="tags">
                ${city ? `<span class="tag city">📍 ${city}</span>` : ''}
                ${menu ? `<span class="tag">🍴 ${menu}</span>` : ''}
              </div>

              ${rating ? `<div class="rating">⭐ ${rating}</div>` : ''}
              ${comment ? `<div class="comment">${comment}</div>` : ''}
            </div>

            ${visitDate ? `<div class="date">방문일: ${visitDate}</div>` : ''}
          `;

          grid.appendChild(card);
        });
      } catch (err) {
        console.error(err);
        grid.innerHTML = '<div class="loading">데이터를 불러오지 못했습니다.</div>';
      }
    }

    loadData();
  </script>
</body>
</html>
