<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>MY ARCHIVE</title>
  <style>
    body { background: #0f1117; color: #fff; font-family: sans-serif; padding: 40px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
    .card { background: #1a1d26; border-radius: 12px; padding: 20px; border: 1px solid #2e3440; }
    .title { font-size: 1.2rem; font-weight: bold; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h1>나만의 맛집 & 콘텐츠 기록장.</h1>
  <p style="color: #9ca3af; font-size: 0.9rem;">F12를 눌러 Console(콘솔) 탭에서 받아온 노션 API 원본 데이터를 확인하세요!</p>
  <div class="grid" id="grid">데이터를 불러오는 중...</div>

  <script>
    async function loadData() {
      const grid = document.getElementById('grid');
      try {
        const res = await fetch('/api/notion');
        const data = await res.json();
        
        // 1. 전체 원본 데이터를 콘솔에 출력 (F12 -> Console 탭에서 확인)
        console.log('=== 🚀 노션 API에서 받아온 전체 데이터 목록 ===');
        console.log(data);

        grid.innerHTML = '';

        if (!Array.isArray(data) || data.length === 0) {
          grid.innerHTML = '가져온 데이터가 없거나 올바른 배열 형태가 아닙니다.';
          return;
        }

        data.forEach((item, index) => {
          // 2. 각 항목별 properties 구조 확인용 콘솔
          console.log(`[항목 ${index + 1} 속성들]`, item.properties);

          // 노션 기본 제목 속성 추출 시도
          // 노션 DB에서 '제목' 역할을 하는 속성의 이름을 자동으로 찾아봅니다.
          let name = '제목 없음';
          
          if (item.properties) {
            for (const key in item.properties) {
              const prop = item.properties[key];
              // type이 'title'인 속성을 발견하면 해당 값을 가져옵니다.
              if (prop.type === 'title' && prop.title && prop.title.length > 0) {
                name = prop.title[0].plain_text;
                break;
              }
            }
          }

          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `<div class="title">${name}</div>`;
          grid.appendChild(card);
        });
      } catch (err) {
        console.error('데이터 로딩 중 에러 발생:', err);
        grid.innerHTML = '데이터를 불러오지 못했습니다.';
      }
    }

    loadData();
  </script>
</body>
</html>
