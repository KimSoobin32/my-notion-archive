<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MY RESTAURANT ARCHIVE</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header class="header">
    <h1>🍞 맛집 아카이브</h1>
    <p class="subtitle">카드를 클릭하면 상세 리뷰를 확인할 수 있습니다.</p>
  </header>

  <main class="container">

    
    <!-- index.html 내 정렬 영역 -->
    <div class="controls-bar" style="display: flex; justify-content: flex-end; margin-bottom: 20px;">
      <select id="sort-select" style="background: #2e3440; color: #eceff4; border: 1px solid #4c566a; padding: 8px 12px; border-radius: 6px; font-size: 0.95rem; cursor: pointer;">
        <option value="latest" selected>최신 방문순</option>
        <option value="oldest">오래된 방문순</option>
        <option value="rating-desc">별점 높은순</option>
        <option value="rating-asc">별점 낮은순</option>
      </select>
    </div>

    <!-- 상단 추천 맛집 슬라이드 영역 -->
    <section id="featured-container" class="featured-section" style="display: none;">
      <h2 class="featured-header">🔥 강추! 최고 점수 맛집 (⭐ 5개)</h2>
      <div class="featured-slider">
        <div id="featured-track" class="featured-track"></div>
      </div>
    </section>

   
    <div class="filter-container" style="margin-bottom: 16px;">
      <div id="cuisine-filter-bar" class="cuisine-bar" style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; -webkit-overflow-scrolling: touch;">
        <button class="cuisine-btn active" data-cuisine="ALL">전체</button>
        <button class="cuisine-btn" data-cuisine="한식">한식</button>
        <button class="cuisine-btn" data-cuisine="중식">중식</button>
        <button class="cuisine-btn" data-cuisine="일식">일식</button>
        <button class="cuisine-btn" data-cuisine="양식">양식</button>
        <button class="cuisine-btn" data-cuisine="분식">분식</button>
        <button class="cuisine-btn" data-cuisine="고깃집">고깃집</button>
        <button class="cuisine-btn" data-cuisine="빵">빵</button>
        <button class="cuisine-btn" data-cuisine="카페">카페</button>
        <button class="cuisine-btn" data-cuisine="디저트">디저트</button>
        <button class="cuisine-btn" data-cuisine="햄버거">햄버거</button>
        <button class="cuisine-btn" data-cuisine="마라탕">마라탕</button>
        <button class="cuisine-btn" data-cuisine="샤브샤브">샤브샤브</button>
        <button class="cuisine-btn" data-cuisine="멕시칸">멕시칸</button>
        <button class="cuisine-btn" data-cuisine="베트남">베트남</button>
        <!-- <button class="cuisine-btn" data-cuisine="덮밥">덮밥</button>
        <button class="cuisine-btn" data-cuisine="샐러드">샐러드</button>
        <button class="cuisine-btn" data-cuisine="호프">호프</button> -->
        <button class="cuisine-btn" data-cuisine="기타">기타</button>
      </div>
    </div>

    <div class="controls-bar" style="display: flex; justify-content: flex-end; margin-bottom: 20px;">
      <select id="sort-select" style="background: #2e3440; color: #eceff4; border: 1px solid #4c566a; padding: 8px 12px; border-radius: 6px; font-size: 0.95rem; cursor: pointer;">
        <option value="latest" selected>최신 방문순</option>
        <option value="oldest">오래된 방문순</option>
        <option value="rating-desc">별점 높은순</option>
        <option value="rating-asc">별점 낮은순</option>
      </select>
    </div>

    <div id="restaurant-grid" class="grid"></div>
    
    <div class="grid" id="restaurant-grid">
      <div class="loading">데이터를 불러오는 중입니다...</div>
    </div>
  </main>

  <!-- 상세 리뷰 모달 (팝업) -->
  <div class="modal-overlay" id="modal-overlay" aria-hidden="true">
    <div class="modal">
      <button class="modal-close" id="modal-close">&times;</button>
      <div class="modal-body" id="modal-body">
        <!-- app.js에서 클릭한 카드의 상세 정보가 동적으로 삽입됩니다 -->
      </div>
    </div>
  </div>

  <script src="./js/app.js"></script>
</body>
</html>
